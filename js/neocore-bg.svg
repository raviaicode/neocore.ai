<!--
  NeoCore.ai Animated SVG Background
  - Dark fintech network style
  - Animated glowing lines and nodes
  - Neon blue/green accents
  - Responsive and looped animation
-->
<svg id="neocore-bg" width="100%" height="100%" viewBox="0 0 1440 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#02131d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1440" height="800" rx="0" fill="url(#bg-grad)"/>

  <g opacity="0.18">
    <path d="M0 120H1440" stroke="#67e8f9"/>
    <path d="M0 240H1440" stroke="#67e8f9"/>
    <path d="M0 360H1440" stroke="#67e8f9"/>
    <path d="M0 480H1440" stroke="#67e8f9"/>
    <path d="M0 600H1440" stroke="#67e8f9"/>
    <path d="M0 720H1440" stroke="#67e8f9"/>
    <path d="M120 0V800" stroke="#34d399"/>
    <path d="M320 0V800" stroke="#34d399"/>
    <path d="M520 0V800" stroke="#34d399"/>
    <path d="M720 0V800" stroke="#34d399"/>
    <path d="M920 0V800" stroke="#34d399"/>
    <path d="M1120 0V800" stroke="#34d399"/>
    <path d="M1320 0V800" stroke="#34d399"/>
  </g>

  <g opacity="0.95">
    <path d="M180 420C260 330 340 300 430 350C520 400 560 510 660 480C760 450 860 300 980 320C1080 335 1160 410 1260 360" stroke="url(#line)" stroke-width="3.5" fill="none" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M220 620C320 570 420 560 520 610C620 660 720 690 820 640C920 590 1020 500 1130 520C1220 535 1300 590 1360 560" stroke="url(#line)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M150 180C280 130 430 120 560 180C690 240 820 310 980 250C1110 210 1230 150 1360 200" stroke="url(#line)" stroke-width="2.2" fill="none" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.3;0.75;0.3" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#blur)">
    <circle cx="180" cy="420" r="18" fill="url(#glow)">
      <animate attributeName="r" values="18;26;18" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="350" r="16" fill="url(#glow-green)">
      <animate attributeName="r" values="16;23;16" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="480" r="18" fill="url(#glow)">
      <animate attributeName="r" values="18;25;18" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="320" r="15" fill="url(#glow-green)">
      <animate attributeName="r" values="15;22;15" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1260" cy="360" r="17" fill="url(#glow)">
      <animate attributeName="r" values="17;24;17" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="610" r="14" fill="url(#glow-green)">
      <animate attributeName="r" values="14;21;14" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="640" r="15" fill="url(#glow)">
      <animate attributeName="r" values="15;22;15" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="520" r="14" fill="url(#glow-green)">
      <animate attributeName="r" values="14;21;14" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1360" cy="560" r="13" fill="url(#glow)">
      <animate attributeName="r" values="13;20;13" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.45">
    <circle cx="280" cy="150" r="2.5" fill="#67e8f9"/>
    <circle cx="340" cy="190" r="2" fill="#34d399"/>
    <circle cx="500" cy="120" r="2.5" fill="#67e8f9"/>
    <circle cx="780" cy="140" r="2" fill="#34d399"/>
    <circle cx="1040" cy="170" r="2.2" fill="#67e8f9"/>
    <circle cx="1240" cy="120" r="2" fill="#34d399"/>
    <circle cx="300" cy="680" r="2.2" fill="#67e8f9"/>
    <circle cx="560" cy="730" r="2" fill="#34d399"/>
    <circle cx="880" cy="700" r="2.2" fill="#67e8f9"/>
    <circle cx="1180" cy="730" r="2" fill="#34d399"/>
  </g>
</svg>
