            html, body {
                margin: 0;
                min-height: 100%;
                background: #020817 !important;
                background-color: #020817 !important;
                color: #e2e8f0;
                color-scheme: dark;
            }
            /* Force Tailwind theme variables to dark so bg-background, bg-card, etc. render dark across all sections */
            :root {
                --background: 222 47% 6% !important;
                --foreground: 213 31% 91% !important;
                --card: 222 47% 9% !important;
                --card-foreground: 213 31% 91% !important;
                --popover: 222 47% 9% !important;
                --popover-foreground: 213 31% 91% !important;
                --primary: 172 76% 60% !important;
                --primary-foreground: 222 47% 6% !important;
                --secondary: 222 47% 12% !important;
                --secondary-foreground: 213 31% 91% !important;
                --muted: 222 47% 12% !important;
                --muted-foreground: 215 20% 65% !important;
                --accent: 222 47% 15% !important;
                --accent-foreground: 213 31% 91% !important;
                --border: 222 47% 15% !important;
                --input: 222 47% 15% !important;
            }
            body {
                position: relative;
                overflow-x: hidden;
            }
            /* #root stays transparent so the SVG bg-layer shows on the landing viewport.
               Below the landing, the body's #020817 (forced !important above) is what shows through transparent sections. */
            #bg-layer {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                z-index: 0;
                pointer-events: none;
                background: #020817;
                overflow: hidden;
            }
            #bg-layer svg {
                width: 100%;
                height: 100%;
                display: block;
            }
            #root {
                position: relative;
                z-index: 1;
                min-height: 100vh;
            }
            /* Neutralise all section-level dark backgrounds in the React app so the SVG bg-layer is visible behind it.
               Targets the outer min-h-screen wrapper, <section> blocks, and any direct child of #root with a dark bg.
               Card-level gradients (from-zinc-900/80 etc., which sit on nested divs) are intentionally left untouched. */
            #root .min-h-screen,
            #root > div,
            #root section,
            #root [class*="bg-zinc-950"]:not([class*="/"]),
            #root [class*="bg-zinc-900"]:not([class*="/"]),
            #root [class*="bg-black"]:not([class*="/"]),
            #root [class*="bg-gradient-to-b"][class*="from-zinc"]:not([class*="/"]) {
                background: transparent !important;
                background-image: none !important;
                background-color: transparent !important;
            }
            /* Re-allow nav / header bars that genuinely need a backdrop — give them a translucent dark instead */
            #root header,
            #root nav {
                background-color: rgba(2, 8, 23, 0.55) !important;
                backdrop-filter: blur(6px);
            }
            /* Push the hero landing content down so the Welcome badge sits below the CORE SYSTEM hub instead of overlapping it */
            #root .min-h-screen.flex.items-center.justify-center {
                align-items: flex-start !important;
                padding-top: 290px !important;
            }
            @media (max-height: 800px) {
                #root .min-h-screen.flex.items-center.justify-center {
                    padding-top: 250px !important;
                }
            }
        </style>
